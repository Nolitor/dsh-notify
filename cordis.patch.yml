# Notify for Chrome bundle layer.
# The package is the bundle; this row activates its no-op Host half. Every
# notification runs through the browser's Chrome / Web Notification API. No
# local IPC, HTTP, ports, filesystem access, native notifier or audio engine.
- insert:
    - id: dsh-notify-web
      name: '@nolit/dsh-notify-web'
      config:
        notifyOnComplete: true
        notifyOnApproval: true
        notifyOnQuestion: true
        notifyOnError: true
        completeCooldownMs: 5000
        suppressWhenFocused: false
        requireInteractionForApproval: true
        notifyOnSubagents: false
